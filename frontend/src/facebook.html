<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Login</title>
  
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <style>
    body {
       background:linear-gradient(to bottom,rgb(237, 216, 237),white);
       height: 1000px;    
    }
    .login-container {
      width: 400px;
      margin: 550px;
      padding: 20px;
      background-color:  rgb(244, 244, 244);    
      border: 1px solid;      
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      height: 400px;
      margin-top:100px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2 style="color: blue;" class="text-center">Facebook</h2>
    <form>
      <div class="form-group">
        <input  style="margin-top: 50px;" type="email" class="form-control" placeholder="Email or Phone Number" required>
      </div>
      <div class="form-group" style="margin-top: 20px;">
        <input type="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px; margin-left: 130px;">Log In</button>

    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</body>
</html>

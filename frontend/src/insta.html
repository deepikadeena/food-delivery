<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">                                                               
  <style>
    body {
      background:linear-gradient(to bottom,rgb(237, 216, 237),white);
       height: 1000px;     
    }
    .login-container {
      width: 350px;
      margin: 550px;
      padding: 20px;
      border: 1px solid  ;    
      border-radius: 1px;
      margin-top:100px;
      height: 400px;
     
    }
    .instagram-logo {
      width: 175px;
      height: 50px;
      margin: 20px auto;
                                                                                   
      background-size: cover;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h4 style="margin-top: 10px; margin-left: 30px; color:blue;">Instagram Login</h4>
    <div class="instagram-logo"></div>
    <form >
      
      <div class="form-group" style="margin-top: -40px;">
        <input type="text" class="form-control" placeholder="Phone number, username, or email" required>
      </div>
      <div class="form-group" style="margin-top: 20px;">
        <input type="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px; margin-left: 100px;">Log In</button>

    </form>
   

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  </div>
</body>
</html>
